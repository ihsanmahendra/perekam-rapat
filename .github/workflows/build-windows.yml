name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: >
          dotnet publish windows/PerekamRapat.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: PerekamRapat-Windows
          path: out/PerekamRapat.exe
      - name: Rilis publik
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" out/PerekamRapat.exe
          --repo "${{ github.repository }}"
          --title "Perekam Rapat untuk Windows ${{ github.ref_name }}"
          --notes "Unduh PerekamRapat.exe lalu klik dua kali. Tidak perlu instalasi. Jika SmartScreen memperingatkan: Info lebih lanjut, lalu Tetap jalankan (aplikasi belum ditandatangani)."
