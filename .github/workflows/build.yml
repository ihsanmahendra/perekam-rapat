name: Build macOS app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh --universal
      - name: Zip
        run: cd build && ditto -c -k --keepParent "Perekam Rapat.app" PerekamRapat.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PerekamRapat
          path: build/PerekamRapat.zip
