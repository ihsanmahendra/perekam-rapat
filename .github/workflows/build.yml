name: Build macOS app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          set -o pipefail
          ./build.sh --universal 2>&1 | tee build.log || {
            # Tampilkan error Swift sebagai anotasi GitHub
            grep -E ': (error|warning): ' build.log | sort -u | head -40 | \
              sed -E 's#^.*/(Sources/[^:]+):([0-9]+):([0-9]+): (error|warning): (.*)$#::\4 file=\1,line=\2,col=\3::\5#'
            exit 1
          }
      - name: Zip
        run: cd build && ditto -c -k --keepParent "Perekam Rapat.app" PerekamRapat.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PerekamRapat
          path: build/PerekamRapat.zip
